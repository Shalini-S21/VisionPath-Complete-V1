server.port=8082
spring.application.name=user-service

# Database Configuration (MySQL 8)
#spring.datasource.url=${USER_DB_URL:jdbc:mysql://localhost:3306/visionpath_user?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
#spring.datasource.username=${DB_USERNAME:root}

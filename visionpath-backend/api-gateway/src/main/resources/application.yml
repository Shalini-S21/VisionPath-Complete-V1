server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:

          # ==============================
          # GLOBAL CORS CONFIGURATION
          # ==============================
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "*"
                allowed-origins:
                  - "http://localhost:5173"
                  - "http://localhost:5174"
                  - "http://localhost:3000"
                  - "http://127.0.0.1:5173"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                allow-credentials: true
                max-age: 3600

          # ==============================
          # MICROSERVICE ROUTES
          # ==============================
          routes:

            # 8081: AUTH SERVICE
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**

            # 8082: USER SERVICE
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/users/**

            # 8083: STUDENT SERVICE
            - id: student-service
              uri: ${STUDENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/students/**

            # 8084: COUNSELOR SERVICE
            - id: counselor-service
              uri: ${COUNSELOR_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/counselors/**

            # 8085: ADMIN SERVICE
            - id: admin-service
              uri: ${ADMIN_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/admin/**

            # 8086: ASSESSMENT SERVICE
            - id: assessment-service
              uri: ${ASSESSMENT_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/assessments/**

            # 8087: AI SERVICE
            - id: ai-service
              uri: ${AI_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/ai/**

            # 8088: CAREER SERVICE
            - id: career-service
              uri: ${CAREER_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/careers/**

            # 8089: SKILL SERVICE
            - id: skill-service
              uri: ${SKILL_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/skills/**

            # 8090: STUDY PLAN SERVICE
            - id: study-plan-service
              uri: ${STUDY_PLAN_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/api/study-plans/**

            # 8091: RESUME SERVICE
            - id: resume-service
              uri: ${RESUME_SERVICE_URL:http://localhost:8091}
              predicates:
                - Path=/api/resumes/**

            # 8092: NOTIFICATION SERVICE
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8092}
              predicates:
                - Path=/api/notifications/**

            # 8093: FILE SERVICE
            - id: file-service
              uri: ${FILE_SERVICE_URL:http://localhost:8093}
              predicates:
                - Path=/api/files/**

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: always
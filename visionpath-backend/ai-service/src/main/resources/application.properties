server.port=8087
spring.application.name=ai-service

#spring.datasource.url=${AI_DB_URL:jdbc:mysql://localhost:3306/visionpath_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
#spring.datasource.username=${DB_USERNAME:root}

spring.datasource.url=jdbc:postgresql://localhost:5432/visionpath_resume 
spring.datasource.username=postgres
spring.datasource.password=postgre123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

ai.service.url=${AI_SERVICE_URL:http://localhost:8087}
fastapi.service.url=${FASTAPI_SERVICE_URL:http://localhost:8000}
file.service.url=${FILE_SERVICE_URL:http://localhost:8093}

management.endpoints.web.exposure.include=health,info


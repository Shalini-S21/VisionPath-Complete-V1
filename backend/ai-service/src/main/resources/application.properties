server.port=8087
spring.application.name=ai-service

spring.datasource.url=${AI_DB_URL:jdbc:mysql://localhost:3306/visionpath_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Root@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

ai.api.key=${AI_API_KEY:mock_ai_key_visionpath}

management.endpoints.web.exposure.include=health,info

server.port=8091
spring.application.name=resume-service

spring.datasource.url=${RESUME_DB_URL:jdbc:mysql://localhost:3306/visionpath_resume?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Root@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

ai.service.url=${AI_SERVICE_URL:http://localhost:8087}
file.service.url=${FILE_SERVICE_URL:http://localhost:8093}

management.endpoints.web.exposure.include=health,info
